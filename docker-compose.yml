# FoodRescue - local stack.
# Profiles: core (this build), search / pipeline (reserved for upcoming components), all.
# `.env` sets COMPOSE_PROFILES=core so a plain `docker compose up` starts the core stack.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-foodrescue}:${POSTGRES_PASSWORD:-foodrescue}@postgres:5432/${POSTGRES_DB:-foodrescue}
  MONGO_URL: mongodb://mongo:27017
  MONGO_DB: foodrescue
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32-bytes-min}
  # Activates the production JWT-secret guard in app/config.py.  Backend and worker
  # containers will refuse to start unless JWT_SECRET is a strong, non-placeholder value.
  FOODRESCUE_ENV: production
  INBOX_DIR: /data/inbox
  API_INTERNAL_URL: http://127.0.0.1:8000
  SIM_DIRECT_INGEST: ${SIM_DIRECT_INGEST:-true}
  ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}

services:
  postgres:
    image: postgres:16-alpine
    profiles: [ core, all ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodrescue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodrescue}
      POSTGRES_DB: ${POSTGRES_DB:-foodrescue}
    ports: [ "${POSTGRES_PORT:-5433}:5432" ]
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodrescue}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    profiles: [ core, all ]
    ports: [ "${MONGO_PORT:-27017}:27017" ]
    volumes: [ mongodata:/data/db ]
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 10s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    profiles: [ core, all ]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports: [ "5672:5672", "15672:15672" ]
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: [ core, all ]
    environment: *backend-env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: [ "8000:8000" ]
    volumes:
      - ./data/inbox:/data/inbox
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: [ core, all ]
    environment: *backend-env
    command: python -m app.worker.consumer
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    profiles: [ core, all ]
    ports: [ "5173:80" ]
    depends_on:
      backend: { condition: service_healthy }

  # ---- Pipeline services (profile: pipeline or all) ----

  nifi:
    image: apache/nifi:1.28.1
    profiles: [ pipeline, all ]
    # Single-user auth is required since NiFi 1.14.  Override NIFI_PASSWORD in .env for
    # any shared environment; never use the default in production.
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USER:-admin}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:-nifi-local-dev-password-change-me}
      NIFI_WEB_HTTP_PORT: "8080"
      NIFI_WEB_HTTP_HOST: "0.0.0.0"
      NIFI_WEB_HTTPS_PORT: "" # Disable HTTPS for local dev; re-enable for production.
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    ports:
      - "${NIFI_PORT:-8080}:8080"
    volumes:
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_db:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - ./data/inbox:/data/inbox:rw # NiFi reads and removes CSVs (GetFile, Keep Source File=false)
      - ./data/nifi-failed:/data/nifi-failed # Failed files land here
      - ./nifi:/nifi-config:ro # Version-controlled flow config / scripts
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/nifi/ > /dev/null" ]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
    depends_on:
      backend: { condition: service_healthy }
  # ---- Search (profile: search or all) ----
  # Single-node Elasticsearch 8 with security disabled for local dev.
  # Start: docker compose --profile search up elasticsearch -d
  # API:   http://localhost:9200
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    profiles: [ search, all ]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---- Airflow (profile: airflow or all) ----
  # Runs airflow standalone (SequentialExecutor + SQLite metadata DB).
  # Start with: docker compose --profile airflow up airflow -d
  # UI: http://localhost:8081   login: admin / foodrescue123
  airflow:
    image: apache/airflow:2.9.3
    profiles: [ airflow, all ]
    command: standalone
    user: "50000:0"
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-foodrescue-airflow-dev-key-32-bytes!}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-foodrescue123}
      # Credentials passed to the DAG (never hardcoded in the DAG file)
      FOODRESCUE_DB_URL: postgresql://foodrescue:foodrescue@postgres:5432/foodrescue
      FOODRESCUE_API_URL: http://backend:8000
      FOODRESCUE_ES_URL: http://elasticsearch:9200
      _PIP_ADDITIONAL_REQUIREMENTS: duckdb>=1.0
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow_home:/opt/airflow
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  nifi_state:
  nifi_db:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  esdata:
  airflow_home:
