# FoodRescue NiFi Ingestion Data Contract
# Version: 1.1
# Integration boundary: POST /ingest/batch (FastAPI)
# NiFi flow: GetFile → UpdateAttribute → InvokeHTTP → PutFile (failure path)

schema_version: "1.1"

# ─────────────────────────────────────────────────────────────────────────────
# HTTP request contract
# ─────────────────────────────────────────────────────────────────────────────
endpoint:
  method: POST
  path: /ingest/batch
  content_type: text/csv
  auth: Bearer <JWT token — set via --auth-token / FOODRESCUE_AUTH_TOKEN; never hardcoded>

request_headers:
  Authorization:
    required: true
    format: "Bearer <JWT>"
    notes: >
      Admin JWT token.  Passed as a dynamic property on InvokeHTTP so it is
      sent as an HTTP request header.  Never stored in version-controlled files.

  X-Ingest-Source:
    required: false
    default: "nifi-inbox"
    allowed_values: ["nifi-inbox", "upload", "api", "sim"]
    notes: >
      Set by UpdateAttribute from the hardcoded value "nifi-inbox".
      Forwarded to the backend as an HTTP header via InvokeHTTP "Attributes to Send"
      regex (X-Ingest-.*).  Stored in IngestBatch.source for traceability.
      Values outside the allowed set are silently mapped to "api" by the backend.

  X-Ingest-Filename:
    required: false
    notes: >
      Set by UpdateAttribute as "${filename}" (NiFi FlowFile attribute).
      Contains the original filename from GetFile (e.g. "batch_2026-10-15.csv").
      Forwarded to the backend via the same "Attributes to Send" regex.
      Stored in IngestBatch.filename for traceability.

request_body:
  format: CSV (RFC 4180)
  encoding: UTF-8 (BOM-stripped by backend)
  header_row: required
  max_rows: 5000

# ─────────────────────────────────────────────────────────────────────────────
# Donation record fields (record_type = donation | surplus | "")
# ─────────────────────────────────────────────────────────────────────────────
donation_record:
  record_type:
    type: string
    required: false
    default: "donation"
    allowed_values: ["donation", "surplus", ""]
    notes: Omit or set to "donation" for all donation records.

  org_name:
    type: string
    required: true
    max_length: 255
    notes: Name of the donating organization. Used as a stable donor identifier.

  food_type:
    type: string
    required: true
    max_length: 255
    example: "Chicken Biryani"

  category:
    type: string
    required: true
    allowed_values:
      - cooked_meals
      - bakery
      - produce
      - dairy
      - packaged
      - beverages
    aliases:
      - "Veg Meals" → cooked_meals
      - "BREAD" → bakery
      - "Fresh Produce" → produce
      - "Milk" → dairy
      - "Dry Goods" → packaged
      - "Juice" → beverages
    notes: >
      Case-insensitive. Common aliases are normalised automatically.
      Unknown categories are rejected and written to the rejected_rows table.

  quantity_kg:
    type: float
    required: true
    min: 0.001
    max: 5000.0

  expiry_time:
    type: datetime
    required: true
    formats:
      - "YYYY-MM-DDTHH:MM:SS"       # ISO 8601 preferred
      - "YYYY-MM-DD HH:MM:SS"
      - "DD/MM/YYYY HH:MM"
      - "DD-MM-YYYY HH:MM"
    timezone: UTC (naive datetime assumed UTC)
    constraints:
      - must be at least 60 minutes in the future (short shelf-life rejection)

  area:
    type: string
    required: true
    allowed_values:
      - Nerul
      - Vashi
      - Belapur
      - Kharghar
      - Sanpada
      - Airoli
      - Seawoods
    notes: Used to impute lat/lng if coordinates are not provided.

  lat:
    type: float
    required: false
    notes: WGS-84 latitude. Imputed from area centroid if omitted.

  lng:
    type: float
    required: false
    notes: WGS-84 longitude. Imputed from area centroid if omitted.

# ─────────────────────────────────────────────────────────────────────────────
# NGO request record fields (record_type = request | need | ngo_request)
# ─────────────────────────────────────────────────────────────────────────────
request_record:
  record_type:
    type: string
    required: true
    allowed_values: ["request", "need", "ngo_request"]

  org_name:
    type: string
    required: true
    notes: Name of the NGO making the request.

  category:
    type: string
    required: false
    notes: Null/empty means "any category".

  quantity_kg:
    type: float
    required: true
    min: 0.001
    max: 5000.0

  expiry_time:
    type: datetime
    required: true
    notes: >
      For requests this is the "needed_by" deadline.
      Must not be in the past.

  area:
    type: string
    required: true

# ─────────────────────────────────────────────────────────────────────────────
# Idempotency
# ─────────────────────────────────────────────────────────────────────────────
idempotency:
  key_fields: [org_name, food_type, area, expiry_time, quantity_kg]
  mechanism: >
    The ingestion service computes a SHA-256 dedupe_key from the normalized
    key fields and rejects any row whose key already exists in the donations
    table.  Retrying an identical CSV file is safe: duplicates are rejected
    with reason "duplicate of an existing record" and are visible in
    GET /ingest/rejected.
  batch_retry_safety: >
    Full batch retries are safe.  Duplicate rows are counted in rejected_rows
    but do not appear in PostgreSQL as new Donation rows.

# ─────────────────────────────────────────────────────────────────────────────
# Error handling
# ─────────────────────────────────────────────────────────────────────────────
errors:
  validation_errors:
    http_status: 200 (partial success — see rejected_rows in response body)
    storage: rejected_rows table in PostgreSQL
    api: GET /ingest/rejected?batch_id=<id>
    nifi_action: >
      200 response → InvokeHTTP routes to "Response" (auto-terminated).
      Individual row rejections are NOT surfaced as HTTP errors — the batch
      is accepted with rejected_rows > 0.  Inspect via GET /ingest/rejected.

  authentication_error:
    http_status: 401
    nifi_action: No Retry → PutFile /data/nifi-failed (4xx = no retry)

  authorization_error:
    http_status: 403
    nifi_action: No Retry → PutFile /data/nifi-failed (4xx = no retry)

  payload_error:
    http_status: 422
    nifi_action: No Retry → PutFile /data/nifi-failed (4xx = no retry)

  server_error:
    http_status: 500
    nifi_action: Retry → PutFile /data/nifi-failed
    notes: >
      5xx responses are routed via the "Retry" relationship to PutFile.
      They are NOT auto-terminated — the original CSV is preserved in
      /data/nifi-failed for manual inspection and replay.

  connection_failure:
    nifi_action: Failure → PutFile /data/nifi-failed
    notes: >
      Connection refused, timeout, or SSL errors go to the "Failure"
      relationship → PutFile.  The original CSV is preserved.

# ─────────────────────────────────────────────────────────────────────────────
# NiFi flow configuration
# ─────────────────────────────────────────────────────────────────────────────
nifi:
  source_directory: /data/inbox
  inbox_mount: ./data/inbox:/data/inbox:rw   # rw required for GetFile (Keep Source File=false)
  file_pattern: "[^\\.].*\\.csv"
  failure_directory: /data/nifi-failed
  keep_source_file: false    # Consumed (deleted) after successful GetFile

  processors:
    GetFile:
      scheduling_period: "10 sec"
      keep_source_file: "false"

    UpdateAttribute:
      properties:
        X-Ingest-Source: "nifi-inbox"
        X-Ingest-Filename: "${filename}"

    InvokeHTTP:
      request_content_type: "text/csv"
      send_message_body: "true"
      attributes_to_send: "X-Ingest-.*"
      authorization: "Bearer <auth_token>"    # dynamic property → Authorization header
      connection_timeout: "30 sec"
      read_timeout: "60 sec"
      relationships:
        Response: auto-terminate      # 2xx response body
        Original: auto-terminate      # original FlowFile on success
        Failure: PutFile              # connection/timeout errors
        No Retry: PutFile             # 4xx errors
        Retry: PutFile                # 5xx errors — MUST NOT be auto-terminated

    PutFile:
      directory: /data/nifi-failed
      conflict_resolution: replace
      relationships:
        success: auto-terminate
        failure: auto-terminate

  parameters:
    - name: backend.url
      value: "http://backend:8000"
      sensitive: false
    - name: ingest.source
      value: "nifi-inbox"
      sensitive: false
    - name: auth.token
      description: >
        Admin JWT token for /ingest/batch.  Pass via --auth-token CLI arg or
        FOODRESCUE_AUTH_TOKEN env var.  NEVER hardcode in flow definitions or
        version-controlled files.
      sensitive: true
